name: Build Release APK

# Builds a signed release APK. Runs on every push to main (artifact only) and, when you push a
# version tag like `v0.1.0`, also publishes the APK to a GitHub Release.
#
# The native library (app/src/main/jniLibs/arm64-v8a/libaviary_imessage.so) is committed prebuilt,
# so CI only runs Gradle. Rebuilding it needs OpenBubbles' rustpush cloned locally plus the patch
# series in app/src/main/rust/patches — see the README there.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        # v3 installs the obsolete `tools` SDK package, which Google has since removed from the
        # repository — it started failing every build with "Failed to find package 'tools'".
        uses: android-actions/setup-android@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Stage APK with a friendly name
        id: stage
        run: |
          SRC=app/build/outputs/apk/release/app-release.apk
          NAME="relay-${GITHUB_REF_NAME}.apk"
          cp "$SRC" "$NAME"
          echo "apk=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: relay-apk
          path: ${{ steps.stage.outputs.apk }}
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.stage.outputs.apk }}
          generate_release_notes: true
